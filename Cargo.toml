[workspace]
resolver = "2"
members = ["crates/ringrt", "crates/phhtp-core", "crates/phhtp-server", "crates/phhtp-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lewisjohnvillamor/phhtp"

[workspace.dependencies]
httparse = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
mio = { version = "1", features = ["os-poll", "net"] }
socket2 = { version = "0.5", features = ["all"] }
hdrhistogram = "7"
libc = "0.2"

[workspace.metadata]
# Only ringrt and phhtp-core are meant for crates.io; the server and bench are
# marked publish = false in their own manifests.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
