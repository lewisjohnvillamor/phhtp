[package]
name = "phhtp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "phhtp: one HTTP/1.1 server, seven I/O runtimes, for benchmarking"
publish = false

[[bin]]
name = "phhtp"
path = "src/main.rs"

[dependencies]
phhtp-core = { path = "../phhtp-core" }
clap.workspace = true
tokio.workspace = true
mio.workspace = true
socket2.workspace = true
libc.workspace = true
ringrt = { path = "../ringrt" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json.workspace = true
