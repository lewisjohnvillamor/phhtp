[package]
name = "phhtp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "phhtp: one HTTP/1.1 server, seven I/O runtimes, for benchmarking"
publish = false

[[bin]]
name = "phhtp"
path = "src/main.rs"

[features]
default = ["ext"]
# The open-source io_uring runtimes, for comparison. Disable with
# `--no-default-features` to skip their compile time.
ext = ["monoio", "compio", "glommio", "tokio-uring", "futures-lite"]

[dependencies]
phhtp-core = { path = "../phhtp-core" }
clap.workspace = true
tokio.workspace = true
mio.workspace = true
socket2.workspace = true
libc.workspace = true
ringrt = { path = "../ringrt" }
monoio = { version = "0.2", optional = true }
compio = { version = "0.19", features = ["runtime", "net", "time", "io", "io-uring"], optional = true }
glommio = { version = "0.9", optional = true }
tokio-uring = { version = "0.5", optional = true }
futures-lite = { version = "2", optional = true }

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json.workspace = true
